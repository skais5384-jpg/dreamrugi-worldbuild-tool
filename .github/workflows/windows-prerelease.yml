name: Windows release candidate draft

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed commit SHA on the default branch (40 lowercase hex characters)
        required: true
      version:
        description: Exact source version (0.x prerelease or formal 1.x+), for example 1.0.0
        required: true
        default: 1.0.0

permissions:
  contents: read

concurrency:
  group: windows-prerelease-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Require reviewed default-branch commit
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:REF_NAME -cne $env:DEFAULT_BRANCH -or $env:SOURCE_SHA -cne $env:DISPATCH_SHA) { throw 'Dispatch must use the reviewed default-branch HEAD' }
          if ($env:SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:VERSION -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Invalid source SHA or numeric version' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate fixed source and version
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: python scripts/release-candidate.py snapshot --ref $env:SOURCE_SHA --version $env:VERSION --output "$env:RUNNER_TEMP/validate-source"

  build:
    needs: validate
    runs-on: windows-2022
    # Configure required reviewers before use; no key is supplied to validation or draft jobs.
    environment: prerelease-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --no-self-update
      - name: Prepare source snapshot
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: python scripts/release-candidate.py snapshot --ref $env:SOURCE_SHA --version $env:VERSION --output "$env:RUNNER_TEMP/release-source"
      - name: Build and verify candidate
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
          WORLD_RELEASE_KEY: ${{ secrets.WORLDBUILD_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.WORLDBUILD_UPDATER_KEY_PASSWORD }}
          WORLD_PUBLIC_KEY: ${{ vars.WORLDBUILD_UPDATER_PUBLIC_KEY }}
        run: |
          $keyDir = Join-Path $env:RUNNER_TEMP 'deployment-key'
          New-Item -ItemType Directory -Path $keyDir | Out-Null
          $keyPath = Join-Path $keyDir 'updater.key'
          try {
            if (-not $env:WORLD_RELEASE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -or -not $env:WORLD_PUBLIC_KEY) { throw 'Deployment secrets/public key are not configured' }
            [IO.File]::WriteAllText($keyPath,$env:WORLD_RELEASE_KEY)
            [IO.File]::WriteAllText("$keyPath.pub",$env:WORLD_PUBLIC_KEY)
            Remove-Item Env:\WORLD_RELEASE_KEY
            ./scripts/build-release-candidate.ps1 -Snapshot "$env:RUNNER_TEMP/release-source" -OutputDirectory "$env:RUNNER_TEMP/release-assets" -UpdaterKeyPath $keyPath -ReleaseKeyReceipt './packaging/release-key-receipt.json'
          } finally {
            Remove-Item -LiteralPath $keyPath,"$keyPath.pub" -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\WORLD_RELEASE_KEY,Env:\TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-windows-release-candidate
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    runs-on: windows-2022
    environment: prerelease-draft
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-windows-release-candidate
          path: ${{ runner.temp }}/release-assets/
      - name: Create or resume the same draft without overwriting assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          PUBLIC_KEY_SHA256: ${{ vars.WORLDBUILD_UPDATER_PUBLIC_KEY_SHA256 }}
        run: python scripts/release-candidate.py draft --folder "$env:RUNNER_TEMP/release-assets" --repo $env:REPOSITORY --target $env:SOURCE_SHA --tag "v$env:VERSION" --expected-public-key-sha256 $env:PUBLIC_KEY_SHA256 --execute
